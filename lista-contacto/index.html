<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="icons">
      <span>📞</span>
      <span>@</span>
      <span>✉️</span>
      <span>👆</span>
    </div>

    <h1>Contact List</h1>

    <form id="contactForm">
      <input type="text" id="name" placeholder="Input your name" required>
      <input type="text" id="lastname" placeholder="Input your lastname" required>
      <input type="tel" id="phone" placeholder="Input your phone" required>
      <input type="text" id="city" placeholder="Input your city" required>
      <input type="text" id="address" placeholder="Input your address" required>

      <div class="gender">
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Male"> Male</label>
      </div>

      <button type="submit">ADD</button>
    </form>

    <ul id="contactList"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
