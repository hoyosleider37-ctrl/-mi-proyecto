<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Contactos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div class="decoracion">📞 @ ✉️ 👆</div>
    <h1>Lista de contactos</h1>

    <input type="text" id="nombre" placeholder="Introduce tu nombre">
    <input type="text" id="apellido" placeholder="Introduce tu apellido">
    <input type="text" id="telefono" placeholder="Introduce tu teléfono">
    <input type="text" id="ciudad" placeholder="Introduce tu ciudad">
    <input type="text" id="direccion" placeholder="Introduce tu dirección">

    <div class="genero">
      <label><input type="radio" name="genero" value="Femenino"> Femenino</label>
      <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
    </div>

    <button id="agregarBtn">ADD</button>

    <ul id="listaContactos"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
